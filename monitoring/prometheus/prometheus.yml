# Prometheus does not receive metrics. It goes and fetches them, on a schedule,
# from every target listed here. If a service stops answering, the absence is
# itself a signal -- which is why `up == 0` is the first alert anyone writes.

global:
  scrape_interval: 5s          # short, because this tutorial is 20 minutes
  evaluation_interval: 5s      # long-lived setups usually run 15-60s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: wdbc-api
    metrics_path: /metrics
    static_configs:
      # `api` is the compose service name. Inside the compose network that
      # resolves to the container; from your laptop it does not, which is the
      # usual reason a first prometheus.yml shows the target as DOWN.
      - targets: ["api:8000"]
        labels:
          service: wdbc-api
          env: tutorial

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: evidently
    metrics_path: /metrics
    static_configs:
      - targets: ["evidently:8001"]
        labels:
          service: evidently
          application: drift-monitor
